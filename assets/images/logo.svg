<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <style>

      .bg { fill:#F5F7FA; }

      .ring { fill:none; stroke:#D5DEE8; stroke-width:6; }

      .blue {

        stroke:#356AE6;

        stroke-linecap:round;

        stroke-linejoin:round;

        fill:none;

      }

      .accent { stroke:#B7C3D1; stroke-width:4; stroke-linecap:round; fill:none; }

    </style>

  </defs>



  <!-- Background -->

  <circle cx="256" cy="256" r="208" class="bg"/>

  <circle cx="256" cy="256" r="182" class="ring"/>



  <!-- Top & Bottom Dots -->

  <circle cx="256" cy="74" r="4" fill="#B7C3D1"/>

  <circle cx="256" cy="438" r="4" fill="#B7C3D1"/>



  <!-- Open book silhouette -->

  <path class="blue" stroke-width="16"

    d="M150 330

       L150 218

       C150 218 178 200 210 212

       C236 222 250 238 256 254

       C262 238 276 222 302 212

       C334 200 362 218 362 218

       L362 330

       C362 330 320 312 256 312

       C192 312 150 330 150 330

       Z"/>



  <!-- Spine -->

  <path class="blue" stroke-width="10" d="M256 254 L256 312"/>



  <!-- Page fold accents -->

  <path class="accent" d="M200 230 C215 225 230 232 240 248"/>

  <path class="accent" d="M312 230 C297 225 282 232 272 248"/>



  <!-- Flow lines: pages turning / story in motion -->

  <path class="blue" stroke-width="14" opacity="1"    d="M300 205 C325 195 340 175 332 150"/>

  <path class="blue" stroke-width="10" opacity="0.7"  d="M282 192 C305 178 320 155 308 128"/>

  <path class="blue" stroke-width="6"  opacity="0.45" d="M264 182 C285 165 298 140 282 112"/>

</svg>
