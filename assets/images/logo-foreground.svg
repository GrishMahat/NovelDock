<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Adaptive-icon foreground: glyph only (transparent background).
       Same artwork as assets/images/logo.png (blue outline book, grey page
       accents, blue flow arcs on #F5F7FA) but simplified for launcher sizes:
       the hairline outer ring and dots are dropped (invisible below ~96px
       and they force the book to render tiny), and the book group is scaled
       1.4x so it fills the safe zone instead of floating in padding. -->
  <g transform="translate(256, 270) scale(1.4) translate(-256, -274)">
    <!-- Open book outline -->
    <path stroke="#356AE6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"
      d="M150 330
         L150 218
         C150 218 178 200 210 212
         C236 222 250 238 256 254
         C262 238 276 222 302 212
         C334 200 362 218 362 218
         L362 330
         C362 330 320 312 256 312
         C192 312 150 330 150 330
         Z"/>

    <!-- Spine -->
    <path stroke="#356AE6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M256 254 L256 312"/>

    <!-- Page fold accents -->
    <path stroke="#B7C3D1" stroke-width="4" stroke-linecap="round" fill="none" d="M200 230 C215 225 230 232 240 248"/>
    <path stroke="#B7C3D1" stroke-width="4" stroke-linecap="round" fill="none" d="M312 230 C297 225 282 232 272 248"/>

    <!-- Flow lines: pages turning / story in motion -->
    <path stroke="#356AE6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1" d="M300 205 C325 195 340 175 332 150"/>
    <path stroke="#356AE6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7" d="M282 192 C305 178 320 155 308 128"/>
    <path stroke="#356AE6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45" d="M264 182 C285 165 298 140 282 112"/>
  </g>
</svg>
