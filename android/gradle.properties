# Gradle daemon JVM args — tuned for 3.2 GB RAM / 2-core device
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/gradle-heapdump.hprof

# Kotlin compiler daemon — cap memory separately
kotlin.daemon.jvmargs=-Xmx384m

# Parallel & caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2

# Reduce configuration overhead
org.gradle.configureondemand=true

# Daemon idle timeout — free memory sooner (10 min instead of 3h default)
org.gradle.daemon.idletimeout=600000

# AndroidX (Jetifier off — modern Flutter plugins don't need it)
android.useAndroidX=true
android.enableJetifier=false

android.builtInKotlin=false
android.newDsl=false
