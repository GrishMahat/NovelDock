# Gradle daemon JVM args — tuned for 3.2 GB RAM / 2-core device
# Heap is 2g, not more: the daemon, the Kotlin daemon and the Flutter tool
# all share this machine's 3.2 GB, so an over-large -Xmx starves the box during
# dex and packaging. Metaspace is trimmed to match, keeping the JVM total ~2.4 GB.
#
# The flag below was UseStringDuplication, which is not a real JVM option. The
# daemon could never start, at ANY heap size — every Android build died with
# "Failed connecting to the daemon in 4 retries", then with an immediate
# "Unrecognized VM option". The correct name is UseStringDeduplication.
# Verified: a full `flutter build apk --debug` now succeeds (~11 min cold).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/gradle-heapdump.hprof

# Kotlin compiler daemon — cap memory separately
kotlin.daemon.jvmargs=-Xmx384m

# Parallel & caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2

# Reduce configuration overhead
org.gradle.configureondemand=true

# Daemon idle timeout — free memory sooner (10 min instead of 3h default)
org.gradle.daemon.idletimeout=600000

# AndroidX (Jetifier off — modern Flutter plugins don't need it)
android.useAndroidX=true
android.enableJetifier=false

android.builtInKotlin=false
android.newDsl=false
