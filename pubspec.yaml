name: noveldock
description: "NovelDock - Multi-platform novel reader and downloader"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management (Riverpod 3.x - manual providers, no codegen)
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.3.0

  # Database (Drift)
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  sqlite3: ^3.5.0

  # Networking
  dio: ^5.8.0
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.1.2
  connectivity_plus: ^7.3.1

  # Models & Codegen
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # JS Engine
  flutter_js:
    git:
      url: https://github.com/GrishMahat/flutter_js.git
      ref: v0.9.0

  # Content Rendering
  flutter_widget_from_html: ^0.17.2
  epubx_kuebiko: ^4.2.1
  scrollable_positioned_list: ^0.3.8

  # UI Components
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^5.1.1
  flutter_slidable: ^4.0.3
  flex_color_scheme: ^8.1.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0

  # Platform Features
  flutter_edge_tts:
    git:
      url: https://github.com/GrishMahat/flutter_edge_tts.git
      ref: v0.0.4
  anni_mpris_service: ^0.1.0
  webview_flutter: ^4.12.0
  google_mlkit_translation: ^0.15.1
  flutter_local_notifications: ^22.1.0
  permission_handler: ^13.0.1
  file_picker: ^12.0.0-beta.7
  shared_preferences: ^2.3.4
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  wakelock_plus: ^1.7.0
  package_info_plus: ^10.2.1

  # Content
  html: ^0.15.6

  # Utilities
  collection: ^1.19.1
  intl: ^0.20.3
  path: ^1.9.1
  http: ^1.2.0

  # Cupertino icons
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  just_audio_media_kit:
    git:
      url: https://github.com/GrishMahat/just_audio_media_kit.git
      ref: e4465de568a80222264218ffbcc18a1269a6a531
  media_kit: ^1.2.6
  media_kit_native_event_loop: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_background_service_android: ^6.3.1
  flutter_background_service_ios: ^5.0.3
  flutter_background_service: 5.1.0
  dio_http2_adapter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: 2.34.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/providers/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
        - asset: assets/fonts/Literata-BoldItalic.ttf
          weight: 700
          style: italic

