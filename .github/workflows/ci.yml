name: CI

on:
  push:
    branches: [main]
    # Docs and repo-meta changes don't need format/analyze/test.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'noveldock-providers/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'noveldock-providers/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # Catches the "I tagged but forgot to cut the Unreleased section" case
      # here rather than at release time, when the notes would silently fall
      # back to commit messages.
      - name: Changelog has an Unreleased section
        run: |
          if ! grep -q '^## Unreleased' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## Unreleased' heading. Keep one for work in progress."
            exit 1
          fi
