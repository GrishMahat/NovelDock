name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Signing credentials come from repo secrets; nothing touches git.
      - name: Export signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev pkg-config cmake clang libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      # Portable tarball: unpack anywhere and run ./noveldock
      - name: Pack portable tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C build/linux/x64/release/bundle \
              -czf "NovelDock-$VERSION-linux-x64.tar.gz" .

      - name: Build .deb and .rpm packages
        env:
          NFPM_VERSION: 2.41.0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="${VERSION//-/~}"

          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar -xz nfpm

          STAGE=staging
          mkdir -p $STAGE/opt/noveldock $STAGE/usr/bin $STAGE/usr/share/applications
          cp -r build/linux/x64/release/bundle/* $STAGE/opt/noveldock/
          ln -s /opt/noveldock/noveldock $STAGE/usr/bin/noveldock
          cat > $STAGE/usr/share/applications/noveldock.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=NovelDock
          Comment=Ad-free novel reader
          Exec=/opt/noveldock/noveldock
          Terminal=false
          Categories=Office;Viewer;
          EOF

          cat > nfpm.yaml <<EOF
          name: noveldock
          arch: amd64
          version: $PKG_VERSION
          description: Ad-free novel reader and downloader for desktop
          homepage: https://github.com/GrishMahat/NovelDock
          maintainer: Grish Mahat <grishmahat@gmail.com>
          license: GPL-3.0
          contents:
            - src: $STAGE/opt/noveldock
              dst: /opt/noveldock
            - src: $STAGE/usr/bin/noveldock
              dst: /usr/bin/noveldock
              type: symlink
            - src: $STAGE/usr/share/applications/noveldock.desktop
              dst: /usr/share/applications/noveldock.desktop
          overrides:
            deb:
              depends:
                - libmpv2
                - libgtk-3-0
            rpm:
              depends:
                - mpv-libs
                - gtk3
          EOF

          ./nfpm package -p deb -f nfpm.yaml -t "noveldock_${PKG_VERSION}_amd64.deb"
          ./nfpm package -p rpm -f nfpm.yaml -t "noveldock-${PKG_VERSION}.x86_64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            NovelDock-*-linux-x64.tar.gz
            noveldock_*.deb
            noveldock-*.rpm

  publish:
    needs: [android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
